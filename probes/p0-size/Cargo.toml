# P0 體積量測（docs/plans/004 第四節）。三個 bin 用同一個裸機外殼，相減後才是協定本身的成本。
[workspace]
resolver = "3"
members = ["baseline", "canadensis", "emcyphal", "embnet", "embnet-full"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
