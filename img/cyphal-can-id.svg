<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="bold" fill="#222">Cyphal/CAN 的 29 位元 CAN ID（每格 1 位元，左邊是最高位 28）</text>

  <!-- bit index scale: x = 160 + (28-bit)*28 ; width per bit 28 -->
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="174" y="62">28</text><text x="258" y="62">25</text><text x="286" y="62">24</text><text x="314" y="62">23</text>
    <text x="370" y="62">21</text><text x="398" y="62">20</text><text x="734" y="62">8</text><text x="762" y="62">7</text>
    <text x="790" y="62">6</text><text x="958" y="62">0</text>
  </g>

  <!-- message frame -->
  <text x="30" y="98" font-size="14" font-weight="bold" fill="#333">Message</text>
  <g font-size="12" text-anchor="middle">
    <rect x="160" y="74" width="84" height="40" fill="#fde7cc" stroke="#e07b00"/><text x="202" y="99">Priority</text>
    <rect x="244" y="74" width="28" height="40" fill="#f2f2f2" stroke="#666"/><text x="258" y="99">0</text>
    <rect x="272" y="74" width="28" height="40" fill="#f2f2f2" stroke="#666"/><text x="286" y="99">A</text>
    <rect x="300" y="74" width="28" height="40" fill="#ffffff" stroke="#999" stroke-dasharray="3 2"/><text x="314" y="99" fill="#999">0</text>
    <rect x="328" y="74" width="56" height="40" fill="#ffffff" stroke="#999" stroke-dasharray="3 2"/><text x="356" y="99" fill="#999">1 1</text>
    <rect x="384" y="74" width="364" height="40" fill="#e3f0fb" stroke="#3b7dc4"/><text x="566" y="99">Subject-ID（13）</text>
    <rect x="748" y="74" width="28" height="40" fill="#ffffff" stroke="#999" stroke-dasharray="3 2"/><text x="762" y="99" fill="#999">0</text>
    <rect x="776" y="74" width="196" height="40" fill="#e8f5e9" stroke="#2e7d32"/><text x="874" y="99">來源 Node-ID（7）</text>
  </g>

  <!-- service frame -->
  <text x="30" y="168" font-size="14" font-weight="bold" fill="#333">Service</text>
  <g font-size="12" text-anchor="middle">
    <rect x="160" y="144" width="84" height="40" fill="#fde7cc" stroke="#e07b00"/><text x="202" y="169">Priority</text>
    <rect x="244" y="144" width="28" height="40" fill="#f2f2f2" stroke="#666"/><text x="258" y="169">1</text>
    <rect x="272" y="144" width="28" height="40" fill="#f2f2f2" stroke="#666"/><text x="286" y="169">R</text>
    <rect x="300" y="144" width="28" height="40" fill="#ffffff" stroke="#999" stroke-dasharray="3 2"/><text x="314" y="169" fill="#999">0</text>
    <rect x="328" y="144" width="252" height="40" fill="#e3f0fb" stroke="#3b7dc4"/><text x="454" y="169">Service-ID（9）</text>
    <rect x="580" y="144" width="196" height="40" fill="#e8f5e9" stroke="#2e7d32"/><text x="678" y="169">目的 Node-ID（7）</text>
    <rect x="776" y="144" width="196" height="40" fill="#e8f5e9" stroke="#2e7d32"/><text x="874" y="169">來源 Node-ID（7）</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#444">
    <text x="160" y="214">第 25 位：0 = message、1 = service。A：anonymous。R：1 = request、0 = response。</text>
    <text x="160" y="234">虛線格是保留位元：第 22、21 位固定送 1，收到時忽略；第 23、7 位固定送 0，收到 1 時整框丟棄。</text>
  </g>

  <!-- consequences -->
  <rect x="30" y="256" width="940" height="132" rx="10" fill="#f7f7f7" stroke="#ccc"/>
  <text x="48" y="282" font-size="14" font-weight="bold" fill="#222">由這個配置得到的性質</text>
  <g font-size="13" fill="#333">
    <text x="48" y="306">• Priority 在最高位，所以 8 個優先等級直接由 CAN 仲裁執行：0（Exceptional）最先，7（Optional）最後。</text>
    <text x="48" y="330">• 來源 Node-ID 在 ID 裡，所以不同 Node 永遠不會送出相同的 CAN ID，滿足「同一 ID 不能有兩個發送者」。</text>
    <text x="48" y="354">• 同優先等級時，message 贏 service（第 25 位是 0），response 贏 request（第 24 位）。</text>
    <text x="48" y="378">• Node-ID 只有 7 位元，所以 Cyphal/CAN 最多 128 個 Node。</text>
  </g>
</svg>
