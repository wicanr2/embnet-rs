<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="bold" fill="#222">要估計某個百分位數，至少需要多少樣本（95% 信心的精確區間）</text>
  <text x="30" y="52" font-size="12" fill="#777">條件：uⁿ + (1 − u)ⁿ ≤ 0.05。p50 到 p99 依 Lehmann &amp; Paromau（arXiv:2501.16931）Table 1；p99.9 依同一公式推算。橫軸為對數刻度。</text>

  <g stroke="#eee"><line x1="230" y1="70" x2="230" y2="270"/><line x1="400" y1="70" x2="400" y2="270"/><line x1="570" y1="70" x2="570" y2="270"/><line x1="740" y1="70" x2="740" y2="270"/><line x1="910" y1="70" x2="910" y2="270"/></g>
  <g font-size="11" fill="#888" text-anchor="middle"><text x="230" y="288">1</text><text x="400" y="288">10</text><text x="570" y="288">100</text><text x="740" y="288">1,000</text><text x="910" y="288">10,000</text></g>

  <g font-size="13" fill="#333" text-anchor="end">
    <text x="220" y="94">p50（中位數）</text><text x="220" y="132">p90</text><text x="220" y="170">p95</text><text x="220" y="208">p99</text><text x="220" y="246">p99.9</text>
  </g>
  <g fill="#3b7dc4">
    <path d="M230,80 H358.3 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 H230 z"/>
    <path d="M230,118 H474.6 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 H230 z"/>
    <path d="M230,156 H527 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 H230 z"/>
    <path d="M230,194 H646.9 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 H230 z"/>
    <path d="M230,232 H817 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 H230 z"/>
  </g>
  <g font-size="12" fill="#333">
    <text x="370" y="94">6</text><text x="486" y="132">29</text><text x="539" y="170">59</text><text x="659" y="208">299</text><text x="829" y="246">2,995</text>
  </g>

  <rect x="30" y="304" width="940" height="88" rx="10" fill="#f7f7f7" stroke="#ccc"/>
  <g font-size="12" fill="#333">
    <text x="48" y="328">• 這是「區間存在」的最低門檻。299 筆時，p99 區間的上端就是最大值，幾乎沒有參考價值。</text>
    <text x="48" y="350">• 區間寬度隨樣本數收窄：1,000 筆時，p99 的 95% 區間約落在排序第 984 到 997 筆；10,000 筆時約落在第 9,880 到 9,920 筆（常態近似，推導）。</text>
    <text x="48" y="372">• 所以通過行除了 p99，還要寫樣本數；embnet-rs 要求 p99 至少 10,000 筆，p99.9 至少 100,000 筆。</text>
  </g>
</svg>
