<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="1000" height="380" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="bold" fill="#222">型別演進：新舊版本混用時，兩條規則讓雙方都能讀</text>
  <text x="30" y="52" font-size="12" fill="#777">例：Status.1.0 有欄位 a（uint16）、b（uint8）；Status.1.1 在尾端加上 c（uint8）</text>

  <!-- panel 1 -->
  <text x="30" y="92" font-size="14" font-weight="bold" fill="#333">新版送、舊版收：多出來的被截掉（implicit truncation）</text>
  <g font-size="12" text-anchor="middle">
    <text x="80" y="128" fill="#555">送出 1.1</text>
    <rect x="130" y="110" width="160" height="30" fill="#e3f0fb" stroke="#3b7dc4"/><text x="210" y="130">a</text>
    <rect x="290" y="110" width="80" height="30" fill="#e3f0fb" stroke="#3b7dc4"/><text x="330" y="130">b</text>
    <rect x="370" y="110" width="80" height="30" fill="#fde7cc" stroke="#e07b00"/><text x="410" y="130">c</text>

    <text x="80" y="178" fill="#555">1.0 讀到</text>
    <rect x="130" y="160" width="160" height="30" fill="#e3f0fb" stroke="#3b7dc4"/><text x="210" y="180">a</text>
    <rect x="290" y="160" width="80" height="30" fill="#e3f0fb" stroke="#3b7dc4"/><text x="330" y="180">b</text>
    <rect x="370" y="160" width="80" height="30" fill="#ffffff" stroke="#bbb" stroke-dasharray="4 3"/><text x="410" y="180" fill="#999">忽略</text>
  </g>

  <!-- panel 2 -->
  <text x="520" y="92" font-size="14" font-weight="bold" fill="#333">舊版送、新版收：缺的當成 0（zero extension）</text>
  <g font-size="12" text-anchor="middle">
    <text x="570" y="128" fill="#555">送出 1.0</text>
    <rect x="620" y="110" width="160" height="30" fill="#e3f0fb" stroke="#3b7dc4"/><text x="700" y="130">a</text>
    <rect x="780" y="110" width="80" height="30" fill="#e3f0fb" stroke="#3b7dc4"/><text x="820" y="130">b</text>

    <text x="570" y="178" fill="#555">1.1 讀到</text>
    <rect x="620" y="160" width="160" height="30" fill="#e3f0fb" stroke="#3b7dc4"/><text x="700" y="180">a</text>
    <rect x="780" y="160" width="80" height="30" fill="#e3f0fb" stroke="#3b7dc4"/><text x="820" y="180">b</text>
    <rect x="860" y="160" width="80" height="30" fill="#fde7cc" stroke="#e07b00"/><text x="900" y="180">c = 0</text>
  </g>

  <rect x="30" y="214" width="940" height="152" rx="10" fill="#f7f7f7" stroke="#ccc"/>
  <text x="48" y="240" font-size="14" font-weight="bold" fill="#222">成立的條件</text>
  <g font-size="13" fill="#333">
    <text x="48" y="266">• 新欄位只能加在尾端，而且「c = 0」必須代表合理的預設語意。同一個 major 版本內的各 minor 版本必須語意相容。</text>
    <text x="48" y="290">• 接收端依 extent 配置緩衝。extent 是這個型別日後最多能長到多大，要在第一版就留夠。</text>
    <text x="48" y="314">• 宣告為 sealed 的型別不能再演進，extent 等於它的最大長度。</text>
    <text x="48" y="338">• 傳輸層不得因為 payload 比預期長或短就丟棄整筆 Transfer，補的位元一律是 0。</text>
    <text x="48" y="360" fill="#777">依 Cyphal Specification v1.0 第 3.4.5.5、3.7.1.3、3.7.1.4、3.8.3.2、4.1.1.2 節</text>
  </g>
</svg>
