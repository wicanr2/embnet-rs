<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="1000" height="380" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="bold" fill="#222">Data ID 不上線，只算進 CRC：送錯對象的訊息會表現成 CRC 錯誤</text>

  <!-- CRC input -->
  <text x="40" y="76" font-size="14" font-weight="bold" fill="#333">CRC 的計算範圍</text>
  <g font-size="12" text-anchor="middle">
    <rect x="40" y="88" width="150" height="40" rx="4" fill="#ffffff" stroke="#7b5ea7" stroke-dasharray="5 3"/><text x="115" y="106" fill="#5b3f8a">Data ID</text><text x="115" y="121" font-size="11" fill="#777">（不上線）</text>
    <rect x="194" y="88" width="150" height="40" rx="4" fill="#ffffff" stroke="#7b5ea7" stroke-dasharray="5 3"/><text x="269" y="106" fill="#5b3f8a">Type hash</text><text x="269" y="121" font-size="11" fill="#777">（不上線）</text>
    <rect x="348" y="88" width="100" height="40" rx="4" fill="#fde7cc" stroke="#e07b00"/><text x="398" y="113">序號</text>
    <rect x="452" y="88" width="300" height="40" rx="4" fill="#e3f0fb" stroke="#3b7dc4"/><text x="602" y="113">payload</text>
  </g>

  <!-- wire -->
  <text x="40" y="176" font-size="14" font-weight="bold" fill="#333">線上實際送出</text>
  <g font-size="12" text-anchor="middle">
    <rect x="348" y="188" width="100" height="36" rx="4" fill="#fde7cc" stroke="#e07b00"/><text x="398" y="211">序號</text>
    <rect x="452" y="188" width="300" height="36" rx="4" fill="#e3f0fb" stroke="#3b7dc4"/><text x="602" y="211">payload</text>
    <rect x="756" y="188" width="90" height="36" rx="4" fill="#f2f2f2" stroke="#666"/><text x="801" y="211">CRC</text>
  </g>
  <path d="M760,130 C780,150 790,160 800,186" stroke="#666" fill="none" stroke-dasharray="4 3"/>

  <rect x="30" y="246" width="940" height="124" rx="10" fill="#f7f7f7" stroke="#ccc"/>
  <g font-size="12" fill="#333">
    <text x="48" y="270">• 接收端用「自己期待的」Data ID 與 Type hash 算 CRC。訊息若是別的 Subject 送錯過來，或發送端的型別版本不同，CRC 就對不上。</text>
    <text x="48" y="294">• 不上線就不占頻寬，這對只有 8 B 的 classic CAN 很重要。</text>
    <text x="48" y="318">• 同樣的做法：AUTOSAR E2E Profile 11 的 DATAID_BOTH 與 Profile 22（R24-11 第 169、191 頁）；</text>
    <text x="48" y="340">  PROFIsafe 連序號都不上線，由兩端用同一個種子各自產生，再把位址等參數也算進 CRC（System Description 第 4.2 節）。</text>
    <text x="48" y="362" fill="#777">紫色虛線框：只參與計算、不在線上傳送的欄位。</text>
  </g>
</svg>
