<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="1000" height="440" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="bold" fill="#222">每種測試手段各自擅長抓什麼</text>
  <text x="30" y="52" font-size="12" fill="#777">● 主要用途　○ 可以抓到一部分　空白：不適用</text>

  <!-- header -->
  <g font-size="12" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="390" y="88">panic、越界</text>
    <text x="520" y="88">狀態機邏輯</text>
    <text x="650" y="88">unsafe 的</text><text x="650" y="104">未定義行為</text>
    <text x="780" y="88">與規格不符</text>
    <text x="910" y="88">輸入範圍</text>
  </g>
  <line x1="30" y1="114" x2="970" y2="114" stroke="#ccc"/>

  <g font-size="13" fill="#333">
    <text x="40" y="142">test vector（獨立程式產生）</text>
    <text x="40" y="180">fuzz：直接餵位元組</text>
    <text x="40" y="218">fuzz：結構化輸入（arbitrary）</text>
    <text x="40" y="256">性質測試：對照參考模型</text>
    <text x="40" y="294">Miri</text>
    <text x="40" y="332">Kani 模型檢查</text>
  </g>
  <g font-size="18" fill="#3b7dc4" text-anchor="middle">
    <!-- test vectors -->
    <text x="780" y="144">●</text>
    <!-- fuzz bytes -->
    <text x="390" y="182">●</text><text x="520" y="182">○</text><text x="650" y="182">○</text>
    <!-- fuzz structured -->
    <text x="390" y="220">○</text><text x="520" y="220">●</text>
    <!-- proptest sm -->
    <text x="390" y="258">○</text><text x="520" y="258">●</text><text x="780" y="258">○</text>
    <!-- miri -->
    <text x="650" y="296">●</text>
    <!-- kani -->
    <text x="390" y="334">●</text><text x="520" y="334">○</text><text x="650" y="334">○</text>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="910" y="142">固定的幾組</text>
    <text x="910" y="180">抽樣，有覆蓋回饋</text>
    <text x="910" y="218">抽樣，有覆蓋回饋</text>
    <text x="910" y="256">抽樣，失敗會縮小</text>
    <text x="910" y="294">只跑測試走到的路徑</text>
    <text x="910" y="332">有界內的全部輸入</text>
  </g>
  <g stroke="#eee"><line x1="30" y1="160" x2="970" y2="160"/><line x1="30" y1="198" x2="970" y2="198"/><line x1="30" y1="236" x2="970" y2="236"/><line x1="30" y1="274" x2="970" y2="274"/><line x1="30" y1="312" x2="970" y2="312"/></g>

  <rect x="30" y="352" width="940" height="80" rx="10" fill="#f7f7f7" stroke="#ccc"/>
  <g font-size="12" fill="#333">
    <text x="48" y="376">• fuzz 用 AddressSanitizer 建置，越界與 use-after-free 會立即中止，所以也能抓到一部分 unsafe 的錯誤；Miri 能抓的更多，但只看測試實際走到的路徑。</text>
    <text x="48" y="400">• Kani 在給定的範圍內考慮所有輸入，抽樣抓不到的極少數情況它抓得到；代價是範圍一大就很慢，迴圈要給上限。</text>
    <text x="48" y="422">• 與規格不符只能靠獨立的對照：同一個人寫的實作和測試，可能一起錯。</text>
  </g>
</svg>
