<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="960" height="430" fill="#ffffff"/>
  <defs>
    <marker id="tk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/></marker>
  </defs>
  <text x="30" y="30" font-size="17" font-weight="bold" fill="#222">RS-485 上的 token passing：同一時間只有持有 token 的主端能發話</text>
  <g transform="translate(0,30)">

  <!-- token path -->
  <g stroke="#e07b00" stroke-width="2.5" fill="none" marker-end="url(#tk)">
    <path d="M240,118 Q340,62 438,118"/>
    <path d="M522,118 Q620,62 718,118"/>
    <path d="M760,110 Q760,52 480,52 Q200,52 200,108"/>
  </g>
  <text x="340" y="80" font-size="12" fill="#a65c00" text-anchor="middle">token</text>
  <text x="620" y="80" font-size="12" fill="#a65c00" text-anchor="middle">token</text>
  <text x="480" y="46" font-size="12" fill="#a65c00" text-anchor="middle">回到位址最小的主端，完成一輪</text>

  <!-- masters -->
  <g font-size="13" text-anchor="middle">
    <rect x="140" y="120" width="120" height="44" rx="8" fill="#fff3e0" stroke="#e07b00"/>
    <text x="200" y="140">主端 A</text><text x="200" y="157" font-size="11" fill="#666">位址 1</text>
    <rect x="420" y="120" width="120" height="44" rx="8" fill="#fff3e0" stroke="#e07b00"/>
    <text x="480" y="140">主端 B</text><text x="480" y="157" font-size="11" fill="#666">位址 3</text>
    <rect x="700" y="120" width="120" height="44" rx="8" fill="#fff3e0" stroke="#e07b00"/>
    <text x="760" y="140">主端 C</text><text x="760" y="157" font-size="11" fill="#666">位址 7</text>
  </g>

  <!-- bus -->
  <line x1="80" y1="210" x2="880" y2="210" stroke="#3b7dc4" stroke-width="5"/>
  <text x="888" y="214" font-size="12" fill="#3b7dc4">RS-485</text>
  <g stroke="#666" stroke-width="1.5">
    <line x1="200" y1="164" x2="200" y2="210"/><line x1="480" y1="164" x2="480" y2="210"/><line x1="760" y1="164" x2="760" y2="210"/>
    <line x1="340" y1="210" x2="340" y2="248"/><line x1="620" y1="210" x2="620" y2="248"/>
  </g>

  <!-- slaves -->
  <g font-size="13" text-anchor="middle">
    <rect x="280" y="248" width="120" height="40" rx="8" fill="#f2f2f2" stroke="#666"/>
    <text x="340" y="273">從端 S1</text>
    <rect x="560" y="248" width="120" height="40" rx="8" fill="#f2f2f2" stroke="#666"/>
    <text x="620" y="273">從端 S2</text>
  </g>
  <text x="480" y="308" font-size="12" fill="#666" text-anchor="middle">從端只回應主端的詢問，不參與 token</text>

  <rect x="30" y="326" width="900" height="64" rx="8" fill="#f7f7f7" stroke="#ccc"/>
  <text x="48" y="350" font-size="13" fill="#333">每個主端持有 token 時最多送 Nmax_info_frames 個框（BACnet MS/TP），主端數也有上限，所以一輪的時間有上限：</text>
  <text x="48" y="374" font-size="13" fill="#333">一輪 ≤ Σ（Nmax_i ×（最長框 + 最長回覆等待））+ 主端數 × 傳 token 的時間。最壞情況下，一個主端要等一整輪才能發話。</text>
  </g>
</svg>
