<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="1000" height="420" fill="#ffffff"/>
  <defs>
    <marker id="sm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <text x="30" y="30" font-size="17" font-weight="bold" fill="#222">接收端的狀態機：單筆檢查結果累積成「這個資料流（Subject）現在能不能用」</text>

  <g text-anchor="middle">
    <rect x="40" y="150" width="160" height="70" rx="14" fill="#f2f2f2" stroke="#666" stroke-width="2"/>
    <text x="120" y="180" font-size="15" font-weight="bold">NODATA</text><text x="120" y="202" font-size="12" fill="#555">還沒收到資料</text>

    <rect x="300" y="150" width="160" height="70" rx="14" fill="#fff3e0" stroke="#e07b00" stroke-width="2"/>
    <text x="380" y="180" font-size="15" font-weight="bold" fill="#a65c00">INIT</text><text x="380" y="202" font-size="12" fill="#555">有資料，還不能用</text>

    <rect x="580" y="70" width="170" height="70" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="665" y="100" font-size="15" font-weight="bold" fill="#2e7d32">VALID</text><text x="665" y="122" font-size="12" fill="#555">資料可以用</text>

    <rect x="580" y="230" width="170" height="70" rx="14" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
    <text x="665" y="260" font-size="15" font-weight="bold" fill="#c62828">INVALID</text><text x="665" y="282" font-size="12" fill="#555">不能用，進安全狀態</text>
  </g>

  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#sm)">
    <path d="M200,185 H296"/>
    <path d="M460,170 C520,150 540,110 576,105"/>
    <path d="M460,200 C520,220 540,260 576,265"/>
    <path d="M640,140 V226"/>
    <path d="M690,230 V144"/>
  </g>
  <g font-size="12" fill="#333">
    <text x="250" y="174" text-anchor="middle" font-size="11">第一筆完好的資料</text>
    <text x="520" y="118" text-anchor="middle">窗內 OK 夠多</text>
    <text x="520" y="262" text-anchor="middle">窗內錯誤太多</text>
    <text x="632" y="190" text-anchor="end">窗內錯誤 &gt; 上限</text>
    <text x="700" y="190">窗內 OK 夠多、錯誤夠少</text>
  </g>

  <rect x="30" y="320" width="940" height="90" rx="10" fill="#f7f7f7" stroke="#ccc"/>
  <g font-size="12" fill="#333">
    <text x="48" y="344">• 每個接收週期的單筆檢查結果是 OK、OKSOMELOST、REPEATED、WRONGSEQUENCE、ERROR、NONEWDATA 之一，放進一個固定長度的滑動窗。</text>
    <text x="48" y="368">• 每個狀態各有窗長、最少 OK 數、最多錯誤數三個參數，用來決定轉移（AUTOSAR E2E R24-11 第 6.20 節）。</text>
    <text x="48" y="392">• 狀態機只負責判斷；進入 INVALID 之後要做什麼，由接收端的應用決定（第 9.4 節）。依 AUTOSAR 第 6.20 節簡化，省略 DEINIT。</text>
  </g>
</svg>
