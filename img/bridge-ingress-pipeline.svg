<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="1000" height="380" fill="#ffffff"/>
  <defs>
    <marker id="bp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="bq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
  </defs>
  <text x="30" y="30" font-size="17" font-weight="bold" fill="#222">Bridge 入口的檢查順序：便宜的先做，每一關丟棄都記成 security 事件</text>

  <g font-size="12" text-anchor="middle">
    <rect x="30" y="70" width="110" height="64" rx="8" fill="#f2f2f2" stroke="#666"/><text x="85" y="96">收到 Frame</text><text x="85" y="114" font-size="11" fill="#666">中斷只複製</text>
    <rect x="160" y="70" width="110" height="64" rx="8" fill="#e3f0fb" stroke="#3b7dc4"/><text x="215" y="96">解析</text><text x="215" y="114" font-size="11" fill="#666">不 panic、不越界</text>
    <rect x="290" y="70" width="110" height="64" rx="8" fill="#e3f0fb" stroke="#3b7dc4"/><text x="345" y="96">查轉送表</text><text x="345" y="114" font-size="11" fill="#666">不在表內就丟</text>
    <rect x="420" y="70" width="110" height="64" rx="8" fill="#e3f0fb" stroke="#3b7dc4"/><text x="475" y="96">方向與 zone</text><text x="475" y="114" font-size="11" fill="#666">只准列出的方向</text>
    <rect x="550" y="70" width="110" height="64" rx="8" fill="#e3f0fb" stroke="#3b7dc4"/><text x="605" y="96">限流</text><text x="605" y="114" font-size="11" fill="#666">每個 Subject 一個桶</text>
    <rect x="680" y="70" width="110" height="64" rx="8" fill="#e3f0fb" stroke="#3b7dc4"/><text x="735" y="96">間隔檢查</text><text x="735" y="114" font-size="11" fill="#666">比設定週期快太多</text>
    <rect x="810" y="70" width="110" height="64" rx="8" fill="#ede7f6" stroke="#7b5ea7"/><text x="865" y="96">驗證 MAC</text><text x="865" y="114" font-size="11" fill="#666">只在跨 zone 時</text>
  </g>
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#bp)">
    <path d="M140,102 H156"/><path d="M270,102 H286"/><path d="M400,102 H416"/><path d="M530,102 H546"/><path d="M660,102 H676"/><path d="M790,102 H806"/>
    <path d="M900,134 V168"/>
  </g>
  <rect x="850" y="172" width="120" height="40" rx="8" fill="#e8f5e9" stroke="#2e7d32"/><text x="910" y="197" font-size="12" text-anchor="middle">放進出口佇列</text>

  <!-- drop arrows -->
  <g stroke="#c62828" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#bq)">
    <path d="M215,134 V236"/><path d="M345,134 V236"/><path d="M475,134 V236"/><path d="M605,134 V236"/><path d="M735,134 V236"/><path d="M830,134 V236"/>
  </g>
  <rect x="160" y="240" width="700" height="36" rx="8" fill="#fdecea" stroke="#c62828"/>
  <text x="510" y="263" font-size="12" text-anchor="middle" fill="#c62828">丟棄並記錄：哪一關、哪個 Link、哪個來源；計數隨 Heartbeat 發佈</text>

  <rect x="30" y="292" width="940" height="80" rx="10" fill="#f7f7f7" stroke="#ccc"/>
  <g font-size="12" fill="#333">
    <text x="48" y="314">• 順序依成本排：查表與限流遠比 MAC 便宜，MAC 一次要數百到上千個週期（docs/30-safety-security/02 第七節），放最後，洪泛時才不會被拖垮。</text>
    <text x="48" y="336">• 間隔檢查重用設定檔裡的發佈週期：同一 Subject 來得比週期快太多，就是被注入的跡象（Song、Kim、Kim 2016 的時間間隔 IDS 思路）。</text>
    <text x="48" y="358">• AUTOSAR Firewall 也是同一套做法：規則依序比對、未符合者走預設動作、每條規則可限流，丟棄時送 security 事件（RS_Firewall 第 4.1 節）。</text>
  </g>
</svg>
