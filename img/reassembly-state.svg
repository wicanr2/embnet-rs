<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="1000" height="430" fill="#ffffff"/>
  <defs>
    <marker id="r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="r2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
  </defs>
  <text x="30" y="30" font-size="17" font-weight="bold" fill="#222">一個 session 的重組狀態機（依 libcanard v5 與 emcyphal 的規則整理）</text>

  <!-- states -->
  <rect x="40" y="130" width="170" height="70" rx="14" fill="#f2f2f2" stroke="#666" stroke-width="2"/>
  <text x="125" y="160" font-size="15" font-weight="bold" text-anchor="middle">閒置</text>
  <text x="125" y="182" font-size="12" text-anchor="middle" fill="#555">沒有進行中的 Transfer</text>

  <rect x="380" y="130" width="220" height="70" rx="14" fill="#e3f0fb" stroke="#3b7dc4" stroke-width="2"/>
  <text x="490" y="158" font-size="15" font-weight="bold" text-anchor="middle" fill="#2a5d94">累積中</text>
  <text x="490" y="180" font-size="12" text-anchor="middle" fill="#555">記住 Transfer-ID 與下一個 toggle</text>

  <rect x="770" y="130" width="190" height="70" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="865" y="158" font-size="15" font-weight="bold" text-anchor="middle" fill="#2e7d32">交給應用</text>
  <text x="865" y="180" font-size="12" text-anchor="middle" fill="#555">CRC 正確</text>

  <!-- main arrows -->
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#r1)">
    <path d="M210,150 H376"/>
    <path d="M600,150 H766"/>
    <path d="M865,200 V240 H125 V204"/>
    <path d="M520,130 C540,80 440,80 460,128"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="293" y="140">收到 start 框</text>
    <text x="683" y="140">收到 end 框</text>
    <text x="490" y="74">下一框：Transfer-ID 相同、toggle 正確</text>
    <text x="290" y="258">完成後回到閒置；單框直接交給應用</text>
  </g>

  <!-- error arrows -->
  <g stroke="#c62828" stroke-width="2" fill="none" marker-end="url(#r2)" stroke-dasharray="6 4">
    <path d="M440,200 V300 H140 V204"/>
  </g>
  <text x="290" y="318" font-size="12" fill="#c62828" text-anchor="middle">CRC 錯、或逾時：丟掉，回到閒置</text>

  <rect x="30" y="338" width="940" height="84" rx="10" fill="#f7f7f7" stroke="#ccc"/>
  <g font-size="12" fill="#333">
    <text x="48" y="360">• 中途收到新 Transfer-ID 的 start 框：丟掉舊的，從這一框重新累積。沒有對應狀態的非 start 框直接丟。</text>
    <text x="48" y="382">• toggle 不對的框：libcanard 丟掉這一框、保留累積；emcyphal 直接中止這筆 Transfer。兩者都不會把錯框拼進去。</text>
    <text x="48" y="404">• payload 超過緩衝（extent）：只存到 extent 為止，CRC 照樣算完整的 payload，結果交給應用時已截斷。</text>
  </g>
</svg>
