<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <defs>
    <marker id="fz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <text x="30" y="30" font-size="17" font-weight="bold" fill="#222">coverage-guided fuzzing：走到新路徑的輸入才留下來繼續變異</text>

  <g font-size="13" text-anchor="middle">
    <rect x="40" y="80" width="180" height="70" rx="10" fill="#f2f2f2" stroke="#666"/><text x="130" y="110">語料庫</text><text x="130" y="130" font-size="11" fill="#555">fuzz/corpus/&lt;target&gt;</text>
    <rect x="280" y="80" width="180" height="70" rx="10" fill="#e3f0fb" stroke="#3b7dc4"/><text x="370" y="110">挑一個輸入變異</text><text x="370" y="130" font-size="11" fill="#555">翻位元、插入、拼接</text>
    <rect x="520" y="80" width="180" height="70" rx="10" fill="#e3f0fb" stroke="#3b7dc4"/><text x="610" y="110">執行 fuzz target</text><text x="610" y="130" font-size="11" fill="#555">插樁記錄走過的邊</text>
    <rect x="760" y="80" width="200" height="70" rx="10" fill="#fff3e0" stroke="#e07b00"/><text x="860" y="110">走到新的邊嗎？</text><text x="860" y="130" font-size="11" fill="#555">比較指令的運算元也回饋</text>

    <rect x="760" y="200" width="200" height="60" rx="10" fill="#fdecea" stroke="#c62828"/><text x="860" y="226">panic 或 sanitizer 中止</text><text x="860" y="244" font-size="11" fill="#555">存到 fuzz/artifacts/</text>
  </g>
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#fz)">
    <path d="M220,115 H276"/><path d="M460,115 H516"/><path d="M700,115 H756"/>
    <path d="M860,80 V60 H130 V76"/>
    <path d="M610,150 V230 H756"/>
  </g>
  <g font-size="12" fill="#333">
    <text x="495" y="54" text-anchor="middle">是：加進語料庫</text>
    <text x="620" y="190">失敗</text>
  </g>

  <rect x="30" y="282" width="940" height="108" rx="10" fill="#f7f7f7" stroke="#ccc"/>
  <g font-size="12" fill="#333">
    <text x="48" y="306">• cargo-fuzz 自動加上 SanitizerCoverage 的插樁（8 位元計數器、比較指令追蹤），預設用 AddressSanitizer；只支援 x86-64 與 AArch64 的 Unix 系統。</text>
    <text x="48" y="330">• cargo fuzz tmin 把失敗輸入縮到最小；cargo fuzz cmin 把語料庫縮成覆蓋相同的最小集合。</text>
    <text x="48" y="354">• cargo fuzz coverage 用 -Cinstrument-coverage 重新編譯，把語料庫每個輸入跑一次，產生覆蓋率報告；量的是「目前語料庫走得到哪裡」。</text>
    <text x="48" y="378">• libFuzzer 的原作者已停止主動開發，LLVM 仍修正重要錯誤（llvm.org/docs/LibFuzzer.html）。</text>
  </g>
</svg>
