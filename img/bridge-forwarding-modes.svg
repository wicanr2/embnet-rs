<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="30" y="30" font-size="17" font-weight="bold" fill="#222">Bridge 轉送一筆 4 框的 Transfer：先重組再送，或逐框直通</text>
  <text x="30" y="52" font-size="12" fill="#777">示意圖：入口與出口每框時間相同；藍色是入口框，橘色是出口框</text>

  <!-- mode A -->
  <text x="30" y="96" font-size="14" font-weight="bold" fill="#333">先重組再送</text>
  <g>
    <rect x="200" y="78" width="70" height="22" rx="3" fill="#3b7dc4"/><rect x="272" y="78" width="70" height="22" rx="3" fill="#3b7dc4"/>
    <rect x="344" y="78" width="70" height="22" rx="3" fill="#3b7dc4"/><rect x="416" y="78" width="70" height="22" rx="3" fill="#3b7dc4"/>
    <rect x="488" y="78" width="40" height="22" rx="3" fill="#bbb"/>
    <rect x="530" y="104" width="70" height="22" rx="3" fill="#e07b00"/><rect x="602" y="104" width="70" height="22" rx="3" fill="#e07b00"/>
    <rect x="674" y="104" width="70" height="22" rx="3" fill="#e07b00"/><rect x="746" y="104" width="70" height="22" rx="3" fill="#e07b00"/>
  </g>
  <text x="508" y="70" font-size="11" fill="#666" text-anchor="middle">驗 CRC</text>
  <text x="830" y="120" font-size="12" fill="#333">多等了整筆入口的時間</text>

  <!-- mode B -->
  <text x="30" y="176" font-size="14" font-weight="bold" fill="#333">逐框直通</text>
  <g>
    <rect x="200" y="158" width="70" height="22" rx="3" fill="#3b7dc4"/><rect x="272" y="158" width="70" height="22" rx="3" fill="#3b7dc4"/>
    <rect x="344" y="158" width="70" height="22" rx="3" fill="#3b7dc4"/><rect x="416" y="158" width="70" height="22" rx="3" fill="#3b7dc4"/>
    <rect x="276" y="184" width="70" height="22" rx="3" fill="#e07b00"/><rect x="348" y="184" width="70" height="22" rx="3" fill="#e07b00"/>
    <rect x="420" y="184" width="70" height="22" rx="3" fill="#e07b00"/><rect x="492" y="184" width="70" height="22" rx="3" fill="#e07b00"/>
  </g>
  <text x="580" y="200" font-size="12" fill="#333">只晚一框，但前三框送出時還不知道 CRC 對不對</text>

  <!-- comparison -->
  <rect x="30" y="232" width="940" height="158" rx="10" fill="#f7f7f7" stroke="#ccc"/>
  <g font-size="12" fill="#333">
    <text x="48" y="256" font-weight="bold" font-size="13">取捨（RFC 8930 第 4 到 6 節，以及 Cyphal 論壇的討論）</text>
    <text x="48" y="280">• 先重組再送：延遲多一整筆入口 Transfer 的時間；每筆進行中的 Transfer 都要一個完整緩衝；壞掉的 Transfer 在 Bridge 就被擋下。</text>
    <text x="48" y="302">• 逐框直通：延遲接近一框；只需記住每筆 Transfer 的少量狀態；但缺片或 CRC 錯的 Transfer 會一路被轉送到終點才被丟棄。</text>
    <text x="48" y="324">• 入口與出口格式不同時（CAN 轉 UDP、CAN FD 轉 classic CAN），Transfer-ID、CRC、Tail byte 都要重建，</text>
    <text x="48" y="346">  Cyphal 的作者認為這種情況只能先重組再送。</text>
    <text x="48" y="370">• 例：64 B 的 payload 在 classic CAN 上是 10 框，以最壞 160 µs 一框計，先重組再送多等約 1.6 ms。</text>
  </g>
</svg>
