<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="1000" height="420" fill="#ffffff"/>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
  </defs>
  <text x="30" y="30" font-size="17" font-weight="bold" fill="#222">堆疊溢位：預設配置會靜默改壞全域變數，flip-link 讓它變成 HardFault</text>

  <!-- left: default -->
  <text x="250" y="66" font-size="14" font-weight="bold" text-anchor="middle" fill="#c62828">預設配置（cortex-m-rt）</text>
  <text x="120" y="96" font-size="11" fill="#777" text-anchor="end">RAM 高位址</text>
  <text x="120" y="296" font-size="11" fill="#777" text-anchor="end">RAM 低位址</text>
  <rect x="140" y="80" width="220" height="70" fill="#e3f0fb" stroke="#3b7dc4"/><text x="250" y="112" font-size="13" text-anchor="middle">堆疊</text><text x="250" y="132" font-size="11" text-anchor="middle" fill="#555">從頂端往下長</text>
  <rect x="140" y="150" width="220" height="70" fill="#ffffff" stroke="#bbb" stroke-dasharray="4 3"/><text x="250" y="190" font-size="12" text-anchor="middle" fill="#888">未使用</text>
  <rect x="140" y="220" width="220" height="80" fill="#fde7cc" stroke="#e07b00"/><text x="250" y="256" font-size="13" text-anchor="middle">.bss 與 .data</text><text x="250" y="276" font-size="11" text-anchor="middle" fill="#555">全域與靜態變數</text>
  <path d="M380,110 V236" stroke="#c62828" stroke-width="2.5" fill="none" marker-end="url(#fl)"/>
  <text x="392" y="176" font-size="12" fill="#c62828">堆疊長太大</text>
  <text x="392" y="194" font-size="12" fill="#c62828">直接蓋掉變數</text>
  <text x="392" y="212" font-size="12" fill="#c62828">不會有任何錯誤</text>

  <!-- right: flip-link -->
  <text x="730" y="66" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">flip-link</text>
  <rect x="620" y="80" width="220" height="80" fill="#fde7cc" stroke="#e07b00"/><text x="730" y="116" font-size="13" text-anchor="middle">.bss 與 .data</text><text x="730" y="136" font-size="11" text-anchor="middle" fill="#555">移到上方</text>
  <rect x="620" y="160" width="220" height="70" fill="#e3f0fb" stroke="#3b7dc4"/><text x="730" y="192" font-size="13" text-anchor="middle">堆疊</text><text x="730" y="212" font-size="11" text-anchor="middle" fill="#555">從這裡往下長</text>
  <rect x="620" y="230" width="220" height="10" fill="#c62828"/>
  <text x="730" y="262" font-size="12" text-anchor="middle" fill="#c62828">RAM 的實體邊界</text>
  <path d="M860,186 V236" stroke="#2e7d32" stroke-width="2.5" fill="none" marker-end="url(#fl)"/>
  <text x="872" y="204" font-size="12" fill="#2e7d32">越界存取</text>
  <text x="872" y="222" font-size="12" fill="#2e7d32">觸發 HardFault</text>

  <rect x="30" y="320" width="940" height="90" rx="10" fill="#f7f7f7" stroke="#ccc"/>
  <g font-size="12" fill="#333">
    <text x="48" y="344">• cortex-m-rt 預設把堆疊放在 RAM 的最高位、往下長；堆疊太大時會撞進 .bss 與 .data，覆寫全域變數（flip-link README）。</text>
    <text x="48" y="368">• flip-link 在連結時把順序翻過來，堆疊撞到的是 RAM 的邊界，存取不存在的位址會觸發硬體例外。只支援 LLD 連結，thumb 目標的預設正是 LLD。</text>
    <text x="48" y="392">• 這只是把「靜默損壞」變成「立即停止」；堆疊夠不夠用，仍要用靜態分析（cargo-call-stack）或執行期塗色量測高水位。</text>
  </g>
</svg>
