<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="1000" height="380" fill="#ffffff"/>
  <defs>
    <marker id="bk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <text x="30" y="30" font-size="17" font-weight="bold" fill="#222">Black channel：安全層只放在兩端，中間的傳輸全部當成不可信</text>

  <!-- sender -->
  <rect x="40" y="70" width="190" height="180" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="135" y="96" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">發送端 Node</text>
  <rect x="60" y="112" width="150" height="40" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="135" y="137" font-size="12" text-anchor="middle">應用：產生資料</text>
  <rect x="60" y="166" width="150" height="66" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="135" y="188" font-size="12" text-anchor="middle" font-weight="bold">安全層</text>
  <text x="135" y="206" font-size="11" text-anchor="middle">加上序號與 CRC</text>
  <text x="135" y="222" font-size="11" text-anchor="middle">（Data ID 算進 CRC）</text>

  <!-- black channel -->
  <rect x="270" y="70" width="460" height="180" rx="12" fill="#eeeeee" stroke="#999" stroke-dasharray="6 4"/>
  <text x="500" y="96" font-size="14" font-weight="bold" text-anchor="middle" fill="#555">Black channel（不需要安全認證）</text>
  <g font-size="12" text-anchor="middle">
    <rect x="290" y="140" width="110" height="44" rx="6" fill="#ffffff" stroke="#999"/><text x="345" y="167">CAN 匯流排</text>
    <rect x="445" y="140" width="110" height="44" rx="6" fill="#fde7cc" stroke="#e07b00"/><text x="500" y="160">Bridge</text><text x="500" y="176" font-size="11" fill="#666">轉送、暫存</text>
    <rect x="600" y="140" width="110" height="44" rx="6" fill="#ffffff" stroke="#999"/><text x="655" y="167">UDP</text>
  </g>
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#bk)">
    <path d="M230,162 H286"/><path d="M400,162 H441"/><path d="M555,162 H596"/><path d="M710,162 H766"/>
  </g>
  <text x="500" y="222" font-size="12" text-anchor="middle" fill="#555">可能毀損、遺失、重複、延遲、亂序、送錯對象，也可能重送暫存的舊訊息</text>

  <!-- receiver -->
  <rect x="770" y="70" width="190" height="180" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="865" y="96" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">接收端 Node</text>
  <rect x="790" y="112" width="150" height="66" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="865" y="134" font-size="12" text-anchor="middle" font-weight="bold">安全層</text>
  <text x="865" y="152" font-size="11" text-anchor="middle">檢查 CRC、序號、期限</text>
  <text x="865" y="168" font-size="11" text-anchor="middle">更新狀態機</text>
  <rect x="790" y="192" width="150" height="40" rx="6" fill="#ffffff" stroke="#2e7d32"/>
  <text x="865" y="217" font-size="12" text-anchor="middle">應用：可用或進安全狀態</text>

  <rect x="30" y="272" width="940" height="98" rx="10" fill="#f7f7f7" stroke="#ccc"/>
  <g font-size="12" fill="#333">
    <text x="48" y="296">• PROFIsafe 的說法：安全層不對傳輸速率與底層的錯誤偵測做任何假設，所以中間的背板、switch、無線鏈路都不需要安全評估。</text>
    <text x="48" y="320">• 代價：安全層只防傳輸錯誤，不防端點本身的錯誤；兩端的 Node 仍要依功能安全標準開發（PROFIsafe System Description 第 5 節）。</text>
    <text x="48" y="344">• 對照的 white channel：整條通道含協定與網路元件都要通過安全認證（依 61508 Association 的簡報轉述 IEC 61508-2 第 7.4.11 節）。</text>
  </g>
</svg>
